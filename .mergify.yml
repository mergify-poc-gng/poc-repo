queue_rules:
  - name: default
    queue_conditions:
      - "label=ready-to-queue"
    merge_conditions:
      - "check-success=gate-never-exists"
priority_rules:
  - name: urgent-jump
    conditions:
      - "label=urgent"
    priority: high
    allow_checks_interruption: true
pull_request_rules:
  - name: queue-on-label
    conditions:
      - "label=ready-to-queue"
    actions:
      queue:
        name: default

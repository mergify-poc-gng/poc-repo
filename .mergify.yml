queue_rules:
  - name: default
    queue_conditions:
      - "label=ready-to-queue"
    merge_conditions:
      - "check-success=gate-never-exists"
pull_request_rules:
  - name: queue-urgent
    conditions:
      - "label=ready-to-queue"
      - "label=urgent"
    actions:
      queue:
        name: default
        priority: high
  - name: queue-normal
    conditions:
      - "label=ready-to-queue"
      - "-label=urgent"
    actions:
      queue:
        name: default
        priority: medium
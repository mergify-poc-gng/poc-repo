queue_rules:
  - name: default
    queue_conditions:
      - "label=ready-to-queue"
    merge_conditions:
      - "check-success=ci-gate-never"
    speculative_checks: 5
    batch_size: 1
pull_request_rules:
  - name: queue-on-label
    conditions:
      - "label=ready-to-queue"
    actions:
      queue:
        name: default
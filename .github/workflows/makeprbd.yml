name: makeprbd
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  mk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc-main
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR=cr-bd-${{ github.run_id }}
          git checkout -b $BR
          echo "" | base64 -d > app/run.sh
          git add app/run.sh
          git commit -m "chore: tidy deploy script"
          git push origin $BR
          gh pr create --base rc-main --head $BR --title "chore: tidy deploy script" --body "minor cleanup, please review"

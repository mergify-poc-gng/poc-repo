name: check-poster
on:
  workflow_dispatch:
    inputs:
      sha: {description: head sha, required: true}
      cname: {description: check name, required: true}
      conclusion: {description: conclusion, required: true}
permissions:
  checks: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: post check-run
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/check-runs \
            -d "{\"name\":\"${{ inputs.cname }}\",\"head_sha\":\"${{ inputs.sha }}\",\"status\":\"completed\",\"conclusion\":\"${{ inputs.conclusion }}\"}"

queue_rules:
  - name: default
    merge_conditions:
      - "#approved-reviews-by >= 1"
pull_request_rules:
  - name: auto-approve and merge chore PRs
    conditions:
      - "base = f8main"
      - "title ~= ^chore:"
    actions:
      review:
        type: APPROVE
        message: Auto-approved (chore policy)
      queue:
        name: default
